# Observability take-home — starter environment.
#
# This starter deliberately contains NO observability stack. Adding metrics,
# distributed tracing, an OpenTelemetry Collector, a dashboard and an alert is
# the assignment. You are expected to extend this compose file.
#
#   docker compose up --build          # start the two services
#   docker compose --profile loadgen up loadgen   # start traffic (separate step)

services:
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      INVENTORY_BASE_LATENCY_MS: "15"
      # Fault scenario is OFF by default. Trigger it at runtime with
      # scripts/trigger_incident.sh (POST /admin/chaos), no restart needed.
      INVENTORY_DEGRADED: "false"
      INVENTORY_DEGRADED_LATENCY_MS: "2000"
      INVENTORY_DEGRADED_PROBABILITY: "0.3"
      OTEL_SERVICE_NAME: "inventory-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROPAGATORS: "tracecontext,baggage"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      INVENTORY_URL: "http://inventory-service:8001"
      UPSTREAM_TIMEOUT_S: "3.0"
      OTEL_SERVICE_NAME: "api-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROPAGATORS: "tracecontext,baggage"
    depends_on:
      inventory-service:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector self-metrics (Prometheus format)
      - "13133:13133" # health_check extension
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env (cp .env.example .env)}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus

  # Traffic generator. Kept behind a profile so `docker compose up` starts only
  # the services; start traffic explicitly when you want it.
  loadgen:
    build: ./loadgen
    environment:
      TARGET_URL: "http://api-service:8000"
      RPS: "10"
    depends_on:
      - api-service
    profiles: ["loadgen"]
    restart: unless-stopped

volumes:
  tempo-data:
  grafana-data:
  prometheus-data:
