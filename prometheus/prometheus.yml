global:
  # 5s: traffic is low during fault scenarios, so a tight interval keeps
  # rate() windows populated and alert/dashboards responsive.
  scrape_interval: 5s
  evaluation_interval: 5s
  # OpenMetrics first: required for exemplars to be scraped.
  scrape_protocols: [OpenMetricsText1.0.0, OpenMetricsText0.0.1, PrometheusText0.0.4]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api-service
    static_configs:
      - targets: ["api-service:8000"]
        labels: {service: api-service}
  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:8001"]
        labels: {service: inventory-service}
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels: {service: otel-collector}
