receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Drop noise spans from the ASGI instrumentation ("<route> http send" / "http receive").
  # OTEL_PYTHON_FASTAPI_EXCLUDE_SPANS is not supported in 0.66b2, and we keep zero-code.
  # Spans matching ANY condition are dropped.
  filter/drop_asgi_noise:
    error_mode: ignore
    traces:
      span:
        - 'kind == SPAN_KIND_INTERNAL and (IsMatch(name, ".* http send$") or IsMatch(name, ".* http receive$"))'
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    # sending_queue / retry_on_failure use defaults (in-memory queue, retry with backoff)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_asgi_noise, batch]
      exporters: [otlp_grpc/tempo]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
